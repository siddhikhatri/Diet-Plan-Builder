<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPlan Pro – Diet Plan Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="styles.css" rel="stylesheet"/>

</head>
<body>
<header>
  <div><h1>NutriPlan Pro</h1><small>Dietitian Meal Plan Creator</small></div>
  <button id="dl">Download PDF</button>
</header>
<main>
  <div id="form"></div>
  <div id="wrap"><div id="doc"></div></div>
</main>
<script>
const S={
 d:{name:'Dr. Sarah Jenkins, RD',qual:'M.Sc. Clinical Nutrition, CDE',clinic:'NutriCare Wellness Clinic',phone:'+1 (555) 019-2834',email:'contact@nutricareclinic.com',logo:''},
 p:{name:'Michael Vance',age:'34 Yrs / Male',date:'Oct 28, 2026 (4 Wks)',goal:'Fat Loss & Muscle Retention'},
 meals:[
  ['Early Morning','07:00 AM',['1 Glass Lukewarm Lemon Water + 5 Soaked Almonds & 2 Walnuts','1 Cup Green Tea / Cumin (Jeera) Water + 2 Dried Figs','1 Glass Overnight Soaked Chia Seed Water (1 tbsp)']],
  ['Breakfast','08:30 AM',['1 Bowl Rolled Oats porridge cooked in almond milk + 1 tbsp chia seeds & berries','2 Moong Dal Chilla + Mint Chutney','2 Egg Whites + 1 Whole Egg Omelette with veggies + 1 Multigrain Toast']],
  ['Mid Morning','11:00 AM',['1 Medium Apple / Guava + 1 tsp Pumpkin Seeds','1 Glass Buttermilk (Chaas) with roasted cumin','1 Cup Fresh Coconut Water']],
  ['Lunch','01:00 PM',['2 Multigrain Roti + 1 Bowl Dal + 1 Bowl Sabzi + Large Salad','1 Cup Brown Rice + Rajma / Chole + Cucumber Salad','150g Grilled Chicken / Tofu + Quinoa + Sauteed Vegetables']],
  ['Evening Snack','04:30 PM',['1 Cup Roasted Makhana (Foxnuts) + 1 Cup Chamomile / Green Tea','1 Scoop Whey / Plant Protein shake with water','1 Boiled Egg / 50g Grilled Paneer Cubes with Black Pepper']],
  ['Dinner','07:30 PM',['150g Baked Fish or Paneer + Large Bowl Steamed Broccoli & Zucchini','1 Bowl Lentil Vegetable Soup + Garden Salad with Olive Oil Dressing','1 Bowl Vegetable Khichdi or Foxtail Millet Pulao + Cucumber Raita']],
  ['Post Dinner / Night Cap','09:30 PM',['1 Cup Warm Turmeric Milk (Golden Milk) with pinch of black pepper','1 Cup Warm Peppermint / Chamomile Herbal Tea','1 Square (10g) Dark Chocolate (70%+ Cacao)']]
 ].map(([n,time,o])=>({n,time,o})),
 accent:'#1d4ed8',show:{notes:true},
 notes:'Hydration: Drink at least 3.0 to 3.5 Liters of water daily.\nOil Target: Limit cooking oil to maximum 2 teaspoons (10ml) per day.\nFoods to Avoid: Refined sugars, deep-fried foods, carbonated sodas, processed snacks.\nSleep & Timing: Maintain 7-8 hours of sound sleep. Finish dinner at least 2 hours before bedtime.'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(p)=>p.split('.').reduce((o,k)=>o[k],S);
const set=(p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
const fld=(p,l)=>`<div><label>${l}</label><input type="text" data-k="${p}" value="${esc(get(p))}"></div>`;

function buildForm(){
 $('#form').innerHTML=`
 <div class="card"><h2>1. Dietitian & Clinic Info</h2><div class="g2">
  ${fld('d.name','Dietitian Name')}${fld('d.qual','Qualifications / Speciality')}
  ${fld('d.clinic','Clinic / Brand Name')}${fld('d.phone','Phone / WhatsApp')}
  ${fld('d.email','Email Address')}<div><label>Logo Upload</label><input type="file" id="logo" accept="image/*"></div>
  <div><label>Theme color <small style="font-weight:400;color:var(--mute)">(auto-picked from logo)</small></label><input type="color" id="acc" data-k="accent" value="${S.accent}" style="width:100%;height:38px;padding:2px;border:1px solid #cbd5e1;border-radius:7px"></div></div></div>
 <div class="card"><h2>2. Patient Profile & Goals</h2><div class="g2">
  ${fld('p.name','Patient Full Name')}${fld('p.age','Age / Gender')}
  ${fld('p.date','Start Date / Duration')}${fld('p.goal','Health Goal / Objective')}</div></div>
 <div class="card"><h2>3. Daily Meal Schedule</h2>${S.meals.map((m,i)=>`
  <div class="meal"><div class="mh"><input type="text" data-m="${i}" data-f="n" value="${esc(m.n)}"><input type="text" data-m="${i}" data-f="time" value="${esc(m.time)}"><button class="x" data-rm="${i}" title="Remove this meal">Remove meal</button></div>
  ${m.o.map((o,j)=>`<div class="or"><span>Opt ${j+1}</span><input type="text" data-m="${i}" data-o="${j}" value="${esc(o)}"><button class="x" data-del="${i},${j}" title="Remove">&times;</button></div>`).join('')}
  <button class="add" data-add="${i}">+ Add option</button></div>`).join('')}<button class="addm" data-addmeal="1">+ Add meal</button></div>
 <div class="card"><h2>4. Guidelines & Notes <span class="sw"><input type="checkbox" data-show="notes" ${S.show.notes?'checked':''}>Show in plan</span></h2><label>One guideline per line</label><textarea data-k="notes">${esc(S.notes)}</textarea></div>`;
}

function preview(){try{drawPreview()}catch(err){console.error(err);$('#doc').innerHTML='<p style="color:#b91c1c">Preview error: '+esc(err.message)+'</p>'}}
const mix=(h,a)=>{const n=parseInt(h.slice(1),16);return '#'+[16,8,0].map(k=>Math.round(((n>>k)&255)*a+255*(1-a)).toString(16).padStart(2,'0')).join('')};
function drawPreview(){
 const {d,p}=S;
 const st=$('#doc').style;st.setProperty('--ac',S.accent);st.setProperty('--tint',mix(S.accent,.08));st.setProperty('--tint2',mix(S.accent,.28));
 const has=v=>String(v||'').trim()!=='';
 const cell=(l,v)=>has(v)?`<div><small>${l}</small><b>${esc(v)}</b></div>`:'';
 const box=(items)=>items.join('');
 const pi=box([cell('Patient Name',p.name),cell('Age / Gender',p.age),cell('Date / Duration',p.date),cell('Target Goal',p.goal)]);
 const meals=S.meals.filter(m=>m.o.some(x=>x.trim()));
 const notes=!S.show.notes?[]:S.notes.split('\n').filter(x=>x.trim());
 const contact=[d.phone,d.email].filter(has).map(esc).join(' &nbsp;|&nbsp; ');
 $('#doc').innerHTML=`
 <div class="hd"><div><h2>${esc(d.clinic)}</h2><p><b>${esc(d.name)}</b></p><p>${esc(d.qual)}</p>${contact?`<p style="font-size:12px">${contact}</p>`:''}</div>
  <div class="logo${d.logo?' has':''}"${d.logo?` style="background-image:url('${d.logo}')"`:''}>${d.logo?'':'&#10047;'}</div></div>
 ${pi?`<div class="pi">${pi}</div>`:'<div style="height:16px"></div>'}
 ${meals.length?`<div class="st">DAILY MEAL SCHEDULE</div>`:''}
 ${meals.map(m=>`<div class="m"><div class="t"><span>${esc(m.n)}</span><i>${esc(m.time)}</i></div>
  ${m.o.filter(x=>x.trim()).map(o=>`<div class="o"><span>${esc(o)}</span></div>`).join('<div class="orsep">OR</div>')}</div>`).join('')}
 ${notes.length?`<div class="st">DIETITIAN GUIDELINES & INSTRUCTIONS</div><ul class="gl">${notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`;
}

$('#form').addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.show){S.show[t.dataset.show]=t.checked;preview();return}
 if(t.dataset.k)set(t.dataset.k,t.value);
 else if(t.dataset.f)S.meals[t.dataset.m][t.dataset.f]=t.value;
 else if(t.dataset.o!==undefined)S.meals[t.dataset.m].o[t.dataset.o]=t.value;
 preview();
});
$('#form').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.add!==undefined)S.meals[b.dataset.add].o.push('');
 else if(b.dataset.rm!==undefined)S.meals.splice(b.dataset.rm,1);
 else if(b.dataset.addmeal)S.meals.push({n:'New Meal',time:'12:00 PM',o:['','','']});
 else if(b.dataset.del){const[i,j]=b.dataset.del.split(',');S.meals[i].o.splice(j,1)}
 else return;
 buildForm();preview();
});
$('#form').addEventListener('change',e=>{
 if(e.target.id!=='logo'||!e.target.files[0])return;
 const r=new FileReader();r.onload=()=>{S.d.logo=r.result;preview();
  const im=new Image();im.onload=()=>{try{
   const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);
   const px=x.getImageData(0,0,48,48).data,h={};
   for(let i=0;i<px.length;i+=4){const[a,b,g]=[px[i],px[i+1],px[i+2]],mx=Math.max(a,b,g),mn=Math.min(a,b,g);
    if(px[i+3]<200||mx-mn<60||mx>235||mx<50)continue;
    const k=[a,b,g].map(v=>Math.round(v/64)).join();const e=h[k]||(h[k]={n:0,r:0,g:0,b:0});e.n++;e.r+=a;e.g+=b;e.b+=g}
   const best=Object.values(h).sort((a,b)=>b.n-a.n)[0];if(!best)return;
   let [R,G,B]=[best.r,best.g,best.b].map(v=>v/best.n);
   if(R*.299+G*.587+B*.114>150){R*=.75;G*=.75;B*=.75}
   S.accent='#'+[R,G,B].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
   $('#acc').value=S.accent;preview();
  }catch(err){}};im.src=r.result};r.readAsDataURL(e.target.files[0]);
});

$('#dl').onclick=async()=>{
 const b=$('#dl');b.disabled=true;b.textContent='Preparing PDF…';
 const name=(S.p.name||'Patient').replace(/[^\w]+/g,'_');
 const holder=document.createElement('div');
 holder.style.cssText='position:fixed;left:0;top:0;width:794px;background:#fff;z-index:-1;overflow:visible';
 const clone=$('#doc').cloneNode(true);
 clone.style.width='794px';clone.style.margin='0';clone.style.boxShadow='none';
 holder.appendChild(clone);document.body.appendChild(holder);
 try{
  window.scrollTo(0,0);
  await html2pdf().set({margin:[8,0,8,0],filename:name+'_Diet_Plan.pdf',image:{type:'jpeg',quality:.96},
   html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,x:0,y:0,windowWidth:794,width:794},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
   pagebreak:{mode:['css','legacy'],avoid:['.m','.gl','.pi','.mac']}}).from(clone).save();
 }catch(err){alert('Could not create the PDF. Please try again.')}
 holder.remove();
 b.disabled=false;b.textContent='Download PDF';
};

buildForm();preview();
</script>
</body>
</html>
